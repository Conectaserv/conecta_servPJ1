# Configuração opcional para deploy no Render (Blueprint)
services:
  - type: web
    name: conectaserv
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:application
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      # Descomente após anexar disco persistente em /var/data (plano Starter+):
      # - key: DATABASE_PATH
      #   value: /var/data/conecta_serv.db
