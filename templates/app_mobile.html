<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4F5FE8">
    <title>ConectaServ App</title>
    <link rel="manifest" href="{{ url_for('pwa_manifest') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app_mobile.css') }}">
</head>
<body>
    <header class="m-top">
        <div>
            <p class="m-brand">ConectaServ <span>2.0</span></p>
            <small id="mSub">O mesmo design. A mesma API.</small>
        </div>
        <button type="button" class="m-install" id="mInstall" hidden>Instalar</button>
    </header>

    <main id="mView" class="m-view"></main>

    <nav class="m-tabbar">
        <button data-tab="home" class="on"><i class="fas fa-home"></i> Início</button>
        <button data-tab="projetos"><i class="fas fa-briefcase"></i> Projetos</button>
        <button data-tab="chat"><i class="fas fa-comments"></i> Chat</button>
        <button data-tab="conta"><i class="fas fa-user"></i> Conta</button>
    </nav>

    <script src="{{ url_for('static', filename='js/app_mobile.js') }}"></script>
</body>
</html>
